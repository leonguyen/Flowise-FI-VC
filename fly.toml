app = "your-flowise-app"  # Replace with unique name
primary_region = "sin"    # Closest to Ho Chi Minh City (or use "hkg", "iad")

[build]

[env]
FLOWISE_USERNAME = "admin"
FLOWISE_PASSWORD = "your-strong-password"  # Change this!
BLOB_STORAGE_PATH = "/data"
DATABASE_PATH = "/data"
SECRETKEY_PATH = "/data"
APIKEY_PATH = "/data"

[[mounts]]
source = "flowise_vol"
destination = "/data"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "connections"
hard_limit = 100
soft_limit = 50

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512