# fly.toml app configuration file generated for flowise-fi-vc on 2026-05-13T06:46:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'flowise-fi-vc'
primary_region = 'sin'

[build]

[env]
  APIKEY_PATH = '/data'
  BLOB_STORAGE_PATH = '/data'
  DATABASE_PATH = '/data'
  FLOWISE_PASSWORD = 'your-strong-password'
  FLOWISE_USERNAME = 'admin'
  SECRETKEY_PATH = '/data'

[[mounts]]
  source = 'flowise_vol'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 50

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
